services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    env_file:
      - path: .env
        required: false   # cp .env.example .env pour surcharger les valeurs par défaut
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lms:lms_dev_password@postgres:5432/lms}
      SECRET_KEY: ${SECRET_KEY:-change-me-dev-only-not-for-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost","http://localhost:80"]}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms_net
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lms_net:
    driver: bridge
