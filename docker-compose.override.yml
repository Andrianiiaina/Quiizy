# Surcharges de développement — appliquées automatiquement par docker compose
services:
  backend:
    volumes:
      - ./backend:/app
      - /app/__pycache__
    # En dev, on bypasse entrypoint.sh (permissions du volume) et on utilise --reload
    entrypoint: ["/bin/sh", "-c"]
    command: ["alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      DEBUG: "true"

  frontend:
    build:
      target: deps
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:5175"   # 8080 était bloqué par un processus fantôme au niveau du démon Docker
    environment:
      VITE_PROXY_TARGET: http://backend:8000

  postgres:
    ports:
      - "5432:5432"   # expose postgres pour les outils DB locaux (DBeaver, psql, etc.)
